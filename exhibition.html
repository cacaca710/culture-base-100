<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打開地方未來式｜中臺灣文化百頁行動共創展 — 山海匯聚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ── 共創展頁 ───────────────────── */
  .expo-stage {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 58%) minmax(0, 42%);
    align-items: center;
    gap: 24px;
  }
  .grow-wrap { height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .grow-wrap svg { width: 100%; height: 96%; }

  .expo-info { padding-right: 3vw; }
  .expo-info .kicker {
    font-size: 13px; letter-spacing: .3em; color: var(--ink-soft); margin-bottom: 10px;
  }
  .expo-title {
    font-size: clamp(38px, 4.6vw, 64px);
    font-weight: 900;
    letter-spacing: .14em;
    line-height: 1.25;
    margin-bottom: 18px;
    display: flex; flex-wrap: wrap;
  }
  .expo-title span {
    opacity: 0;
    transform: translateY(26px);
  }
  .play .expo-title span { animation: charUp .7s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes charUp { to { opacity: 1; transform: none; } }

  .expo-meta {
    opacity: 0;
    transition: opacity 1s ease .2s;
  }
  .play .expo-meta { opacity: 1; transition-delay: 6.2s; }
  .expo-meta .name { font-size: clamp(17px, 1.6vw, 22px); font-weight: 900; letter-spacing: .12em; margin-bottom: 14px; }
  .expo-meta .date-big {
    font-size: clamp(26px, 2.8vw, 40px); font-weight: 900; letter-spacing: .06em;
    display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
  }
  .expo-meta .date-big .wd { font-size: 14px; font-weight: 700; color: var(--ink-soft); letter-spacing: .1em; }
  .expo-meta .date-big .arrow-line { flex: 0 0 44px; height: 2px; background: var(--ink); }
  .expo-meta .rows { font-size: 15px; line-height: 2.1; letter-spacing: .06em; color: var(--ink); }
  .expo-meta .rows b { letter-spacing: .18em; font-weight: 900; margin-right: 10px; }
  .expo-meta .series {
    display: inline-block; margin-top: 14px;
    font-size: 12.5px; letter-spacing: .14em; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; background: var(--card);
  }
  .expo-actions { margin-top: 22px; display: flex; gap: 10px; }
  .expo-actions button {
    font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: .1em;
    padding: 9px 20px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--ink); background: var(--card); color: var(--ink);
    transition: all .2s;
  }
  .expo-actions button:hover { background: var(--ink); color: var(--paper); }

  /* ── 年輪長芽成樹動畫 ───────────────────── */
  .g-rings ellipse {
    fill: none;
    stroke: #b9b3a2;
    transform-origin: 480px 600px;
    transform: scale(0);
    opacity: 0;
  }
  .play .g-rings ellipse { animation: ringGrow 1s cubic-bezier(.2,.75,.35,1.1) forwards; }
  @keyframes ringGrow { to { transform: scale(1); opacity: 1; } }

  .stem {
    fill: none; stroke: #5d5b53; stroke-linecap: round;
    stroke-dasharray: 1000; stroke-dashoffset: 1000;
  }
  .play .stem { animation: draw 1.6s ease-out forwards; }
  .play .stem.trunk { animation-duration: 2s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .leaf {
    fill: #84bf41;
    transform-origin: var(--ox) var(--oy);
    transform: scale(0);
  }
  .play .leaf { animation: pop .55s cubic-bezier(.3,1.6,.5,1) forwards; }
  @keyframes pop { to { transform: scale(1); } }

  .crown {
    transform-origin: var(--ox) var(--oy);
    transform: scale(0);
  }
  .play .crown { animation: pop .8s cubic-bezier(.3,1.5,.45,1) forwards; }
  .crown-sway {
    transform-origin: var(--ox) var(--oy);
    animation: sway 5.5s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.4deg); }
    50%      { transform: rotate(1.4deg); }
  }
  .crown circle { fill: none; }
  .crown .disc { stroke: none; opacity: .16; }

  .seed-note {
    font-size: 15px; letter-spacing: .35em; fill: var(--ink-soft);
    opacity: 0;
  }
  .play .seed-note { animation: fadeIn 1.2s ease 1s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }

  @media (max-aspect-ratio: 1/1) {
    .expo-stage { grid-template-columns: 1fr; }
    .grow-wrap svg { height: 52vh; }
    .expo-info { padding: 0 4vw 5vh; }
  }
</style>
</head>

            <circle cx="352" cy="368" r="44" stroke="#3fb6cd" stroke-width="2.6" stroke-dasharray="120 8 60 8"/>
            <circle cx="352" cy="368" r="58" stroke="#3fb6cd" stroke-width="2.2" stroke-dasharray="160 10 90 8"/>
            <circle cx="352" cy="368" r="71" stroke="#3fb6cd" stroke-width="2.6" stroke-dasharray="220 12 120 10"/>

            <circle cx="388" cy="238" r="29" stroke="#eecb2f" stroke-width="2.2" stroke-dasharray="66 8 40 6"/>
            <circle cx="388" cy="238" r="43" stroke="#eecb2f" stroke-width="2.6" stroke-dasharray="112 8 60 8"/>
            <circle cx="388" cy="238" r="56" stroke="#eecb2f" stroke-width="2.2" stroke-dasharray="150 10 86 8"/>
            <circle cx="388" cy="238" r="67" stroke="#eecb2f" stroke-width="2.6" stroke-dasharray="200 12 110 10"/>

      </svg>
    </section>

    <section class="expo-info">

        <div class="name">中臺灣文化百頁行動共創展｜共創展開幕暨成果展覽</div>
        <div class="date-big">

</div>

<script>
(function () {
  const stage = document.getElementById("stage");
  const title = document.getElementById("expo-title");

  // 標題逐字浮現
  const text = title.textContent;
  title.textContent = "";
  [...text].forEach((ch, i) => {
    const s = document.createElement("span");
    s.textContent = ch;
    s.style.animationDelay = (5.6 + i * 0.14) + "s";
    title.appendChild(s);
  });

  function play() {
    stage.classList.remove("play");
    void stage.offsetWidth; // 觸發 reflow 重啟動畫
    stage.classList.add("play");
  }
  document.getElementById("replay").addEventListener("click", play);
  requestAnimationFrame(() => requestAnimationFrame(play));
})();
</script>
</body>
</html>
